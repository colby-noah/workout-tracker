services:
    api:
        build:
            context: ./apps/api
            dockerfile: Dockerfile
        ports:
            - '3000:3000'
        volumes:
            - ./apps/api:/app
            - /app/node_modules
        environment:
            - NODE_ENV=development
            - DATABASE_URL=postgresql://postgres:root@db:5432/postgres
        # Runs migrations, generates the client, and starts dev server
        command: sh -c "npx prisma migrate dev && npm run dev"
        depends_on:
            - db

    db:
        image: postgres:16-alpine
        restart: always
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: root
            POSTGRES_DB: postgres
        ports:
            - '5432:5432'
        volumes:
            - pgdata:/var/lib/postgresql/data

    adminer:
        image: adminer
        restart: always
        ports:
            - '8080:8080'

volumes:
    pgdata:
